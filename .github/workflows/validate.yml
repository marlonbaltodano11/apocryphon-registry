name: Validate registry

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check generated index
        run: npm run check-index

      - name: Validate with @apocryphon/cli
        run: |
          if npm view @apocryphon/cli version >/dev/null 2>&1; then
            npx --yes @apocryphon/cli@latest validate --registry --strict
          else
            echo "::notice::@apocryphon/cli is not published yet; skipping CLI validation."
          fi
